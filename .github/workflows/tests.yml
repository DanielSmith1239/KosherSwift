name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: swift test (Linux, ${{ matrix.tz }})
    runs-on: ubuntu-latest
    container: swift:6.0
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, America/New_York, America/Los_Angeles, Asia/Jerusalem, Asia/Tokyo]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  kosherjava-parity:
    name: KosherJava parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash Tests/KosherJavaParity/run.sh
